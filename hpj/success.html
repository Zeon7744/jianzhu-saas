<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>支付成功 - jianzhu-saas</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f7fa;color:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:40px;max-width:420px;width:90%;text-align:center}
    .icon{font-size:56px;margin-bottom:16px}
    h1{font-size:22px;margin-bottom:8px;color:#16a34a}
    .sub{color:#64748b;font-size:14px;margin-bottom:24px}
    .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
    .row:last-child{border-bottom:none}
    .label{color:#94a3b8}
    .val{font-weight:600}
    .btn{display:inline-block;margin-top:24px;padding:12px 32px;background:#16a34a;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:15px;transition:background .2s}
    .btn:hover{background:#15803d}
    .hint{margin-top:16px;font-size:12px;color:#94a3b8}
  </style>
</head>
<body>
 <div class="card">
  <div class="icon">✅</div>
  <h1>支付成功</h1>
  <p class="sub">感谢您的订阅，权益已开通</p>
  <div class="row"><span class="label">订单号</span><span class="val" id="oid">—</span></div>
  <div class="row"><span class="label">金额</span><span class="val" id="amt">—</span></div>
  <div class="row"><span class="label">套餐</span><span class="val" id="plan">—</span></div>
  <div class="row"><span class="label">时间</span><span class="val" id="ts">—</span></div>
  <a class="btn" href="/">进入控制台</a>
  <p class="hint">如未自动跳转，请点击上方按钮</p>
 </div>
 <script>
  (function(){
    var sp=new URLSearchParams(location.search);
    var order_id=sp.get("order_id")||sp.get("out_trade_no")||"—";
    var amount=sp.get("amount")||sp.get("total_fee")||"—";
    var plan=sp.get("plan")||"pro";
    var ts=sp.get("timestamp")||new Date().toLocaleString("zh-CN");
    document.getElementById("oid").textContent=order_id;
    document.getElementById("amt").textContent=amount==="—"?amount:"¥"+(parseInt(amount)/100);
    document.getElementById("plan").textContent=plan.charAt(0).toUpperCase()+plan.slice(1);
    document.getElementById("ts").textContent=ts;
  })();
 </script>
</body>
</html>
