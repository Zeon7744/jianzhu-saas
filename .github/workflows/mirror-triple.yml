name: Mirror to Gitee & GitCode

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [gitee, gitcode]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Gitee
        if: matrix.platform == 'gitee'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          REPO=${{ github.event.repository.name }}
          git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/Zeon7744/${REPO}.git 2>/dev/null || true
          git push gitee --all --force || echo "Gitee mirror failed"
          git push gitee --tags --force || echo "Gitee tags mirror failed"

      - name: Mirror to GitCode via SSH
        if: matrix.platform == 'gitcode'
        env:
          GITCODE_SSH_KEY: ${{ secrets.GITCODE_SSH_KEY }}
          GITCODE_PASSPHRASE: ${{ secrets.GITCODE_PASSPHRASE }}
        run: |
          set -e
          REPO=${{ github.event.repository.name }}

          # 1. 写入密钥文件并修复格式（兼容 base64 编码或明文）
          if echo "${GITCODE_SSH_KEY:0:100}" | base64 -d > /dev/null 2>&1 && ! head -1 <<< "${GITCODE_SSH_KEY}" | grep -q 'BEGIN'; then
            echo "${GITCODE_SSH_KEY}" | base64 -d > ~/.gitcode_ssh_key
          else
            printf '%s\n' "${GITCODE_SSH_KEY}" > ~/.gitcode_ssh_key
          fi
          chmod 600 ~/.gitcode_ssh_key

          # 2. 配置 SSH：host 指向 gitcode.net，固定使用该密钥
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat > ~/.ssh/config <<EOF
          Host gitcode.net
            HostName gitcode.net
            Port 22
            User git
            IdentityFile ~/.gitcode_ssh_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

          # 3. 如带 passphrase，注册 askpass 脚本实现非交互解锁
          if [ -n "${GITCODE_PASSPHRASE}" ]; then
            cat > /usr/local/bin/ssh-askpass.sh <<EOF
            #!/bin/sh
            echo "${GITCODE_PASSPHRASE}"
            EOF
            chmod +x /usr/local/bin/ssh-askpass.sh
            export SSH_ASKPASS=/usr/local/bin/ssh-askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi

          # 4. 测试 SSH 认证
          ssh -v -T git@gitcode.net 2>&1 | head -5 || true

          # 5. 改为 SSH 远端并推送
          git remote add gitcode git@gitcode.net:Zeon7744/${REPO}.git 2>/dev/null || git remote set-url gitcode git@gitcode.net:Zeon7744/${REPO}.git
          git push gitcode --all --force || echo "GitCode SSH mirror failed"
          git push gitcode --tags --force || echo "GitCode SSH tags mirror failed"
